<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · Cantina Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=Orbitron:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>CANTINA <span>ORDERS</span></strong>
        <small>Outer Rim Refueling &amp; Refreshment</small>
      </span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Floor</a>
      <a href="order.html">Order</a>
      <a href="history.html" aria-current="page">History</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <div>
        <p class="eyebrow">Past orders</p>
        <h1>Order History</h1>
        <p class="lede" id="history-summary">Loading…</p>
      </div>
      <p class="sync" id="sync"><span class="dot" aria-hidden="true"></span><span class="sync-text">Connecting…</span></p>
    </div>

    <section class="card table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Table</th>
            <th>Server</th>
            <th>Closed</th>
            <th>Items</th>
            <th class="num">Subtotal</th>
          </tr>
        </thead>
        <tbody id="history-rows"></tbody>
      </table>
    </section>
  </main>

  <script src="js/common.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/history.js" defer></script>
</body>
</html>
